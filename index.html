<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <style>
        /* 基础样式 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }

        /* 导航栏 */
        header {
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { margin: 0; color: #2c3e50; }

        nav a {
            margin-left: 15px;
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }

        /* 文章列表 */
        article {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        article h2 { margin-top: 0; }
        .date { color: #888; font-size: 0.9em; }

        /* 底部 */
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #777;
            font-size: 0.8em;
        }

        /* 响应式适配 */
        @media (max-width: 600px) {
            body { padding: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>✨ 某某的博客</h1>
        <nav>
            <a href="#">首页</a>
            <a href="#">关于</a>
            <a href="#">联系</a>
        </nav>
    </header>

    <main>
        <article>
            <p class="date">2026年3月3日</p>
            <h2>我的第一篇静态博客文章</h2>
            <p>
                欢迎来到我的数字花园！这是一个完全使用 HTML 和 CSS 构建的静态页面。
                静态网页的好处是<strong>加载速度极快</strong>且<strong>安全性高</strong>。
            </p>
            <p>在这个信息碎片化的时代，能静下心来写点东西总是有意义的。</p>
        </article>

        <article>
            <p class="date">2026年3月2日</p>
            <h2>为什么选择静态网页？</h2>
            <p>相比于复杂的后台管理系统，静态博客具有以下优点：</p>
            <ul>
                <li>无需数据库，零维护成本。</li>
                <li>可以轻松部署在 GitHub Pages 或 Vercel。</li>
                <li>完全掌握样式，自由度极高。</li>
            </ul>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 由 Gemini 辅助设计 | 保持好奇心</p>
    </footer>

</body>
</html>
